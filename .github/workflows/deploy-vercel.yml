name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate Vercel secrets
        run: |
          test -n "${{ secrets.VERCEL_TOKEN }}" || (echo "Missing VERCEL_TOKEN secret" && exit 1)

      - name: Reset Vercel link
        run: rm -rf .vercel

      - name: Pull Vercel environment information
        run: |
          set -e
          if vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}; then
            exit 0
          fi

          echo "Initial vercel pull failed. Retrying with explicit project link..."
          rm -rf .vercel
          PROJECT_NAME="${GITHUB_REPOSITORY#*/}"

          if [ -n "$VERCEL_SCOPE" ]; then
            vercel link --yes --project "$PROJECT_NAME" --scope "$VERCEL_SCOPE" --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel link --yes --project "$PROJECT_NAME" --token=${{ secrets.VERCEL_TOKEN }}
          fi

          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
